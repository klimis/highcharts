<script src="highcharts/exporting.js"></script>

<div id="container"></div>
<script>
   (async () => {
      let topoUrl = "highcharts/world.topo.json";

      const useEuTopology = true; // Set to true to use EU topology

      console.log("useEuTopology", useEuTopology);

      if (useEuTopology) {
         topoUrl = "https://gisco-services.ec.europa.eu/distribution/v2/countries/topojson/CNTR_RG_60M_2024_4326.json";
      }

      const topology = await fetch(topoUrl).then(
         (response) => response.json()
      );

      // Process EU topology to add hc-key property
      if (useEuTopology && topology.objects.CNTR_RG_60M_2024_4326) {
         // Rename the object key to 'default' for Highcharts compatibility
         topology.objects.default = topology.objects.CNTR_RG_60M_2024_4326;
         delete topology.objects.CNTR_RG_60M_2024_4326;

         // Add hc-key property based on ISO codes
         topology.objects.default.geometries.forEach(geo => {
            if (geo.properties) {
               // Map ISO3_CODE to lowercase 2-letter code for compatibility
               const iso2Map = {
                  'AUT': 'at', 'BEL': 'be', 'BGR': 'bg', 'HRV': 'hr', 'CYP': 'cy',
                  'CZE': 'cz', 'DNK': 'dk', 'EST': 'ee', 'FIN': 'fi', 'FRA': 'fr',
                  'DEU': 'de', 'GRC': 'el', 'HUN': 'hu', 'IRL': 'ie', 'ITA': 'it',
                  'LVA': 'lv', 'LTU': 'lt', 'LUX': 'lu', 'MLT': 'mt', 'NLD': 'nl',
                  'POL': 'pl', 'PRT': 'pt', 'ROU': 'ro', 'SVK': 'sk', 'SVN': 'si',
                  'ESP': 'es', 'SWE': 'se', 'USA': 'us', 'JPN': 'jp', 'CHN': 'cn',
                  'GBR': 'gb', 'NOR': 'no', 'CHE': 'ch', 'ISL': 'is', 'RUS': 'ru',
                  'TUR': 'tr', 'UKR': 'ua', 'BLR': 'by', 'MDA': 'md', 'SRB': 'rs',
                  'BIH': 'ba', 'MKD': 'mk', 'ALB': 'al', 'MNE': 'me', 'XKX': 'xk'
               };

               const iso3 = geo.properties.ISO3_CODE;
               const iso2 = iso2Map[iso3] || geo.properties.CNTR_ID?.toLowerCase();

               geo.properties['hc-key'] = iso2;
               geo.properties['iso-a2'] = iso2;
               geo.properties['name'] = geo.properties.NAME_ENGL || geo.properties.CNTR_NAME;
            }
         });
      }

      console.log("topology", topology);

      const urlParams = new URLSearchParams(window.location.search);
      const indexCode = urlParams.get("indicator_code") || "bop_fdi6_pos";
      const sectorCode = urlParams.get("sector_code") || "a";

      const indicatorUrl = `https://api.sectoral.coin-dev.eu/api/indicators/${indexCode}`;

      const responseIndicator = await fetch(indicatorUrl).then((response) =>
         response.json()
      );
      const dataIndicator = responseIndicator.data;


      //read from data/allcountries.json instead of api
      const data = await fetch(
         'data/allcountries.json'
      ).then((response) => response.json());

      // Extract EU27 country IDs from the data for easy reference
      const eu27Countries = data
         .filter(
            (item) => item.id !== "jp" && item.id !== "cn" && item.id !== "us"
         )
         .map((item) => item.id);

      // Create the chart
      Highcharts.mapChart("container", {
         credits: {
            enabled: false,
         },
         chart: {

            map: topology,
            // zooming: {
            //    type: 'xy',
            //    mouseWheel: {
            //       enabled: true,
            //    },
            // },
            // panning: {
            //    enabled: true,
            //    type: 'xy'
            // },
         },

         title: {
            text: dataIndicator.name,
         },

         subtitle: {
            text: dataIndicator.description,
         },

         mapNavigation: {
            enabled: true,
            //enableMouseWheelZoom: true,
            buttonOptions: {
               verticalAlign: "bottom",
            },
         },
         mapView: {
            projection: {
               name: "WebMercator",
            },
            //Dynamically set zoom and center based on data

            zoom: data.some((item) => ["jp", "cn", "us"].includes(item.id))
               ? 1.5
               : 3,
            center: data.some((item) => ["jp", "cn", "us"].includes(item.id))
               ? [20, 45]
               : [10, 54],
         },

         colorAxis: {
            min: 0,
            stops: [
               [0, "#E6A532"], // Orange (lowest values)
               [0.25, "#F0CD91"], // Light orange
               [0.5, "#AAB9E1"], // Light blue
               [0.75, "#6487C3"], // Medium blue
               [1, "#2D50A0"], // Dark blue (highest values)
            ],
         },

         tooltip: {
            useHTML: true,
            formatter: function () {
               // Check if it's an EU27 country

               // For non-EU countries (Japan, China, USA)
               return (
                  "<b>" +
                  this.point.name +
                  "</b><br/>value: <b>" +
                  this.point.value +
                  "</b>"
               );

            },
         },
         legend: {
            enabled: true,
            floating: true,
            // align: "left",
            //   verticalAlign: "bottom",
            layout: "horizontal",
            //  borderWidth: 2,
            // backgroundColor: "lightgray",
            transparent: true,
            borderColor: "white",
            itemStyle: {
               fontSize: "0.8rem",
            },
         },
         series: [
            {
               // Base layer - all countries without labels
               mapData: topology,
               allAreas: true,
               nullColor: "#f0f0f0",
               borderColor: "#ffffff",
               borderWidth: 0.5,
               name: "All Countries",
               enableMouseTracking: false,
               //zoomEnabled: true,
               dataLabels: {
                  enabled: false,
               },
            },
            {
               // Data layer - only countries with data and labels
               data: data,
               mapData: topology,
               joinBy: ["hc-key", "id"],
               allAreas: false,

               name: "Countries with data",
               states: {
                  hover: {
                     color: "#BADA55",
                  },
               },
               dataLabels: {
                  enabled: false,
                  style: {
                     textOutline: "none", // Removes the contrasting outline
                  },
                  backgroundColor: null,
                  formatter: function () {
                     return this.point.name;
                  },
               },
               //     point: {
               //       events: {
               //         mouseOver: function () {
               //           // Only highlight all EU27 countries when hovering over EU countries
               //           if (eu27Countries.includes(this.id)) {
               //             const chart = this.series.chart;
               //             eu27Countries.forEach((countryId) => {
               //               const point = chart.get(countryId);
               //               if (point) point.setState("hover");
               //             });
               //           }
               //           // For non-EU countries (Japan, China, USA), just highlight themselves
               //         },
               //         mouseOut: function () {
               //           // Reset hover state for all EU27 countries if this was an EU country
               //           if (eu27Countries.includes(this.id)) {
               //             const chart = this.series.chart;
               //             eu27Countries.forEach((countryId) => {
               //               const point = chart.get(countryId);
               //               if (point) point.setState("");
               //             });
               //           }
               //           // For non-EU countries, the default behavior will handle the reset
               //         },
               //       },
               //     },
               //   },
            }
         ],
      });
   })();
</script>
