<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>
<script src="https://code.highcharts.com/themes/adaptive.js"></script>
<div class="country-selector">
    <label for="country-select">Select countries to highlight:</label>
    <select id="country-select" multiple size="6">
    </select>
    <small class="hint">Hold Ctrl/Cmd to select multiple countries</small>
</div>
<figure class="highcharts-figure">

    <div id="container"></div>
    <p class="highcharts-description">
        Scatter plots with jittering are used when individual points are so
        dense that visual inspection suffers. This chart displays experiment
        results with a random horizontal jittering to keep them apart.
    </p>
</figure>
<script>
    // Load data from countries JSON files
    async function loadCountriesData() {
        const dataFiles = [
            'data/swarm/countries1.json',
            'data/swarm/countries2.json',
            'data/swarm/countries3.json',
            'data/swarm/countries4.json',
            'data/swarm/countries5.json'
        ];

        try {
            const promises = dataFiles.map(file => fetch(file).then(res => res.json()));
            const countriesData = await Promise.all(promises);

            // Get unique countries for the select list
            const uniqueCountries = [];
            const countryMap = new Map();
            countriesData[0].forEach(country => {
                if (!countryMap.has(country.code)) {
                    countryMap.set(country.code, country.name);
                    uniqueCountries.push({ code: country.code, name: country.name });
                }
            });
            uniqueCountries.sort((a, b) => a.name.localeCompare(b.name));

            // Populate country select
            const countrySelect = document.getElementById('country-select');
            uniqueCountries.forEach(country => {
                const option = document.createElement('option');
                option.value = country.code;
                option.textContent = country.name;
                countrySelect.appendChild(option);
            });

            // Set all series to grey with semi-transparency
            const colors = ['rgba(128, 128, 128, 0.5)'];

            // Transform country data to chart format with country name
            const series = countriesData.map((countries, index) => ({
                name: `indice ${index + 1}`,
                data: countries.map(country => ({
                    x: country.value,
                    y: index,
                    name: country.name,
                    code: country.code
                }))
            }));

            Highcharts.chart('container', {
                chart: {
                    type: 'scatter',
                    height: 600
                },

                colors,

                credits: {
                    enabled: false
                },

                title: {
                    text: 'Policy areas'
                },

                xAxis: {
                    title: {
                        text: 'scaled values'
                    },
                    min: 0,
                    max: 100
                },

                yAxis: {
                    categories: ['indice 1', 'indice 2', 'indice 3', 'indice 4', 'indice 5']
                },

                plotOptions: {
                    scatter: {
                        showInLegend: false,
                        jitter: {
                            x: 0,
                            y: 0.24
                        },
                        marker: {
                            radius: 2,
                            symbol: 'circle'
                        },
                        tooltip: {
                            pointFormat: '<b>{point.name}</b><br/>Value: {point.x}'
                        },
                        states: {
                            inactive: {
                                opacity: 1
                            }
                        },
                        point: {
                            events: {
                                mouseOver: function () {
                                    const code = this.code;
                                    const chart = this.series.chart;

                                    // Find and highlight all points with the same country code
                                    chart.series.forEach(series => {
                                        series.points.forEach(point => {
                                            if (point.code === code) {
                                                point.setState('hover');
                                                point.graphic.attr({
                                                    'stroke': '#000',
                                                    'stroke-width': 2
                                                });
                                            }
                                        });
                                    });
                                },
                                mouseOut: function () {
                                    const code = this.code;
                                    const chart = this.series.chart;

                                    // Reset all highlighted points
                                    chart.series.forEach(series => {
                                        series.points.forEach(point => {
                                            if (point.code === code) {
                                                point.setState('');
                                                point.graphic.attr({
                                                    'stroke-width': 0
                                                });
                                            }
                                        });
                                    });
                                }
                            }
                        }
                    }
                },

                series
            });

            // Add event listener for country selection
            const chart = Highcharts.charts[Highcharts.charts.length - 1];
            const highlightColors = [
                '#FF0000', '#0066FF', '#00CC00', '#FF9900', '#9933FF',
                '#FF1493', '#00CED1', '#FFD700', '#FF4500', '#32CD32',
                '#BA55D3', '#FF6347', '#4169E1', '#FF69B4', '#00FA9A'
            ];

            countrySelect.addEventListener('change', function () {
                const selectedCodes = Array.from(this.selectedOptions).map(opt => opt.value);

                // Reset all points to default style
                chart.series.forEach(series => {
                    series.points.forEach(point => {
                        point.graphic.attr({
                            'stroke-width': 0,
                            'fill-opacity': 0.5
                        });
                    });
                });

                // Highlight selected countries with different colors
                if (selectedCodes.length > 0) {
                    chart.series.forEach(series => {
                        series.points.forEach(point => {
                            const colorIndex = selectedCodes.indexOf(point.code);
                            if (colorIndex !== -1) {
                                point.graphic.attr({
                                    'stroke': highlightColors[colorIndex % highlightColors.length],
                                    'stroke-width': 3,
                                    'fill-opacity': 1
                                });
                            }
                        });
                    });
                }
            });
        } catch (error) {
            console.error('Error loading countries data:', error);
        }
    }

    // Initialize chart when page loads
    loadCountriesData();
</script>
